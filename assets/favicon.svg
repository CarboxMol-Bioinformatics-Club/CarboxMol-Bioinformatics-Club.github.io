<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070e17" />
      <stop offset="60%" stop-color="#0b1726" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- DNA Helix Gradients -->
    <linearGradient id="dnaStrand1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="dnaStrand2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Carboxyl Oxygen Glow Gradient -->
    <radialGradient id="oxygenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </radialGradient>

    <!-- Carbon Backbone Gradient -->
    <radialGradient id="carbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Hydrogen Gradient -->
    <radialGradient id="hydrogenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Background Crystallographic Lattice Mesh -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="0.75" fill="none">
    <polygon points="64,18 96,36 96,72 64,90 32,72 32,36" />
    <polygon points="64,28 86,40 86,66 64,78 42,66 42,40" />
    <line x1="64" y1="18" x2="64" y2="28" />
    <line x1="96" y1="36" x2="86" y2="40" />
    <line x1="96" y1="72" x2="86" y2="66" />
    <line x1="64" y1="90" x2="64" y2="78" />
    <line x1="32" y1="72" x2="42" y2="66" />
    <line x1="32" y1="36" x2="42" y2="40" />
  </g>

  <!-- DNA Double Helix Rungs (Hydrogen Bonds) -->
  <g stroke-linecap="round" stroke-width="2.2" opacity="0.75">
    <line x1="38" y1="26" x2="90" y2="26" stroke="#06b6d4" />
    <line x1="42" y1="38" x2="86" y2="38" stroke="#10b981" />
    <line x1="42" y1="90" x2="86" y2="90" stroke="#38bdf8" />
    <line x1="38" y1="102" x2="90" y2="102" stroke="#10b981" />
  </g>

  <!-- DNA Double Helix Strands (Smooth Sinusoidal Curves) -->
  <path d="M 36,24 Q 64,42 92,64 T 36,104" 
        fill="none" 
        stroke="url(#dnaStrand1)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <path d="M 92,24 Q 64,42 36,64 T 92,104" 
        fill="none" 
        stroke="url(#dnaStrand2)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <!-- CarboxMol Core: Carboxyl Dyad (-COOH) Chemical Structure -->
  <!-- Molecular Chemical Bonds -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- C-C Backbone Bond -->
    <line x1="52" y1="64" x2="76" y2="64" stroke="#38bdf8" stroke-width="4" />
    
    <!-- Left Carbonyl C=O Double Bond -->
    <line x1="50" y1="62" x2="40" y2="44" stroke="#f43f5e" stroke-width="3" />
    <line x1="54" y1="64" x2="44" y2="46" stroke="#f43f5e" stroke-width="3" />

    <!-- Left Hydroxyl C-OH Single Bond -->
    <line x1="52" y1="64" x2="38" y2="82" stroke="#fb7185" stroke-width="3.5" />
    <line x1="38" y1="82" x2="24" y2="82" stroke="#e0e7ff" stroke-width="2.5" />

    <!-- Right Carbonyl C=O Double Bond -->
    <line x1="74" y1="62" x2="84" y2="44" stroke="#f43f5e" stroke-width="3" />
    <line x1="78" y1="64" x2="88" y2="46" stroke="#f43f5e" stroke-width="3" />

    <!-- Right Hydroxyl C-OH Single Bond -->
    <line x1="76" y1="64" x2="90" y2="82" stroke="#fb7185" stroke-width="3.5" />
    <line x1="90" y1="82" x2="104" y2="82" stroke="#e0e7ff" stroke-width="2.5" />

    <!-- Inter-Carboxyl Shared Coordination / Low-Barrier H-Bond -->
    <line x1="52" y1="64" x2="76" y2="64" stroke="#ffffff" stroke-width="2" stroke-dasharray="2.5, 2.5" />
  </g>

  <!-- Atoms / Chemical Nodes (CarboxMol Dyad) -->
  <!-- Carbons -->
  <circle cx="52" cy="64" r="7.5" fill="url(#carbonGlow)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="76" cy="64" r="7.5" fill="url(#carbonGlow)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Carbonyl Oxygens (=O) -->
  <circle cx="42" cy="45" r="8" fill="url(#oxygenGlow)" stroke="#ffffff" stroke-width="1.4" filter="url(#softGlow)" />
  <circle cx="86" cy="45" r="8" fill="url(#oxygenGlow)" stroke="#ffffff" stroke-width="1.4" filter="url(#softGlow)" />

  <!-- Hydroxyl Oxygens (-OH) -->
  <circle cx="38" cy="82" r="7.5" fill="url(#oxygenGlow)" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="90" cy="82" r="7.5" fill="url(#oxygenGlow)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Hydrogens (H) -->
  <circle cx="24" cy="82" r="5" fill="url(#hydrogenGlow)" stroke="#ffffff" stroke-width="1" />
  <circle cx="104" cy="82" r="5" fill="url(#hydrogenGlow)" stroke="#ffffff" stroke-width="1" />

  <!-- Center Active Catalytic Proton H⁺ Node -->
  <circle cx="64" cy="64" r="4.2" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />

  <!-- DNA Nucleotide Base Nodes -->
  <circle cx="36" cy="24" r="4.5" fill="#10b981" />
  <circle cx="92" cy="24" r="4.5" fill="#38bdf8" />
  <circle cx="36" cy="104" r="4.5" fill="#10b981" />
  <circle cx="92" cy="104" r="4.5" fill="#38bdf8" />
</svg>
