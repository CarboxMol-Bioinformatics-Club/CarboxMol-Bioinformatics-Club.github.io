        'teachers': 'teacher-portal',
        'muellim': 'teacher-portal',
        'president': 'president-portal',
        'sedr': 'president-portal'
      };

      if (cleanPath && routeMap[cleanPath]) {
        hashTarget = routeMap[cleanPath];
        window.location.replace('https://carboxmol-bioinformatics-club.github.io/#' + hashTarget);
        return;
      }
    })();
